<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNET // Tactical Logistics Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML2PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-panel: #111827;
            --bg-elevated: #1F2937;
            --accent: #10B981; /* Tactical Emerald */
            --accent-hover: #059669;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .font-mono-data {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

        /* Panel Styling */
        .glass-panel {
            background-color: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
        }

        /* Form Inputs */
        input[type="text"], input[type="number"], select {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 0.5rem;
            padding: 0.625rem 0.75rem;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
            background-color: rgba(0, 0, 0, 0.4);
        }
        select option { background-color: var(--bg-elevated); }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid #4B5563;
            border-radius: 0.25rem;
            background-color: rgba(0,0,0,0.2);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .custom-checkbox:checked {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 30%; top: 15%;
            width: 35%; height: 60%;
            border: solid #000;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Item Row Hover Effect */
        .item-row {
            transition: all 0.2s ease;
        }
        .item-row:hover {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* PDF Styles - Kept clean for official printing */
        #pdf-content {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #111827;
            direction: ltr;
            padding: 40px;
            background-color: white;
            display: none;
        }
        #pdf-content h1 {
            font-size: 22px; font-weight: 800;
            border-bottom: 2px solid #111827;
            padding-bottom: 12px; margin-bottom: 24px;
            letter-spacing: 0.05em; text-transform: uppercase;
        }
        #pdf-content .meta-info {
            font-size: 13px; color: #4B5563; margin-bottom: 30px;
        }
        #pdf-content h2 {
            font-size: 15px; font-weight: 700;
            background-color: #F3F4F6;
            padding: 8px 12px; border-left: 4px solid #111827;
            margin: 24px 0 12px 0;
        }
        #pdf-content ul { list-style: none; padding-left: 15px; }
        #pdf-content ul li {
            font-size: 13px; padding: 4px 0;
            border-bottom: 1px solid #E5E7EB;
            position: relative;
        }
        #pdf-content ul li::before {
            content: "•"; color: #9CA3AF; font-size: 18px;
            position: absolute; left: -15px; top: 0;
        }
        #pdf-content ul li:last-child { border-bottom: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="border-b border-white/10 bg-[#0B0F19]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20">
                    <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h1 class="text-lg font-semibold tracking-wide">BNET <span class="text-emerald-500 font-normal">LOGISTICS</span></h1>
            </div>
            <div class="flex items-center gap-4 text-sm font-mono-data text-gray-400">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
                    <span>SYSTEM READY</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-[1400px] w-full mx-auto px-6 py-8">
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-8 items-start">
            
            <!-- LEFT COLUMN: BUILDER (Controls) -->
            <div class="xl:col-span-7 space-y-6">
                
                <!-- Mission Parameters Panel -->
                <div class="glass-panel p-6">
                    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Mission Parameters
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1.5">DESTINATION</label>
                            <input type="text" id="destination" placeholder="Enter country or location" class="w-full">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1.5">DATES</label>
                            <input type="text" id="dates" placeholder="e.g., Oct 4-11, 2026" class="w-full">
                        </div>
                    </div>

                    <div class="mt-4 pt-4 border-t border-white/5">
                        <label class="block text-xs text-gray-400 mb-2">ATTACH ATA CARNET / DOCUMENTS</label>
                        <input type="file" id="carnetImages" accept="image/*" multiple class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-gray-800 file:text-gray-300 hover:file:bg-gray-700 cursor-pointer transition">
                        <div id="imagePreviewContainer" class="flex flex-wrap gap-3 mt-4 empty:hidden"></div>
                    </div>
                </div>

                <!-- Container Builder Panel -->
                <div class="glass-panel flex flex-col h-[700px]">
                    <div class="p-6 border-b border-white/5 bg-white/[0.02]">
                        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-4 flex items-center gap-2">
                            <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                            Container Configuration
                        </h2>
                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs text-gray-400 mb-1.5">UNIT TYPE</label>
                                <select id="boxType" class="w-full">
                                    <option value="Pelican">Pelican Case</option>
                                    <option value="Ski Bag">Ski Bag</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1.5">UNIT ID</label>
                                <input type="number" id="boxNumber" value="1" class="w-full font-mono-data text-emerald-400 font-bold text-center">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1.5">OWNER / OPERATOR</label>
                                <input type="text" id="boxOwner" placeholder="Name" class="w-full">
                            </div>
                        </div>
                    </div>

                    <!-- Equipment List (Scrollable) -->
                    <div class="flex-grow overflow-y-auto p-4 space-y-1.5" id="equipmentList">
                        <!-- Items injected here by JS -->
                    </div>

                    <!-- Add Custom Item & Submit -->
                    <div class="p-6 border-t border-white/5 bg-white/[0.02]">
                        <div class="flex gap-3 mb-5">
                            <input type="text" id="customItemInput" placeholder="Add custom equipment to database..." class="flex-grow">
                            <button onclick="addCustomItem()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-md text-sm font-medium transition border border-gray-600">
                                Add to DB
                            </button>
                        </div>
                        <button onclick="addContainer()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-semibold tracking-wide transition shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            ADD CONTAINER TO MANIFEST
                        </button>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: LIVE MANIFEST -->
            <div class="xl:col-span-5 h-[calc(100vh-8rem)] sticky top-24">
                <div class="glass-panel h-full flex flex-col overflow-hidden">
                    <div class="p-5 border-b border-white/5 bg-white/[0.02] flex items-center justify-between">
                        <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider flex items-center gap-2">
                            <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            Live Manifest
                        </h2>
                        <button onclick="generatePDF()" class="px-4 py-2 bg-gray-100 hover:bg-white text-gray-900 rounded-md text-xs font-bold tracking-wide transition flex items-center gap-2 shadow-lg">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            EXPORT PDF
                        </button>
                    </div>
                    
                    <div id="previewArea" class="flex-grow overflow-y-auto p-6 space-y-6">
                        <!-- Empty State -->
                        <div class="h-full flex flex-col items-center justify-center text-gray-600 space-y-4">
                            <div class="w-16 h-16 rounded-full bg-gray-800/50 flex items-center justify-center border border-gray-700/50">
                                <svg class="w-8 h-8 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                            </div>
                            <p class="text-sm tracking-wide">NO CONTAINERS CONFIGURED</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Hidden PDF Template (Kept clean for printing) -->
    <div id="pdf-content">
        <h1>TACTICAL EQUIPMENT MANIFEST</h1>
        <div class="meta-info">
            <strong>DESTINATION:</strong> <span id="pdf-dest"></span><br>
            <strong>OPERATION DATES:</strong> <span id="pdf-dates"></span>
        </div>
        <div id="pdf-containers"></div>
        <div id="pdf-carnet-section"></div>
    </div>

    <script>
        const masterEquipment = [
            "BNET HCLOS",
            "Power Supply",
            "Cable Set (RF + J9 + J10 + J11)",
            "Accessories (Mouse, Camera, Charger)",
            "ISR to EUR Power Adapter",
            "Speaker + Microphone",
            "RF Box Single",
            "Variable Attenuator",
            "Power Splitter",
            "RF Cable (5m)",
            "North Finder GNSS + GPS Cables",
            "RF Adapter Toolbox",
            "Screws Toolbox",
            "Pedestal 42",
            "Pedestal 43",
            "Quickset Adapter",
            "Mechanic Adapter",
            "Gibraltar Tripod Adapter",
            "Pedestal Power Cable",
            "Chapman",
            "Harris Sector Antenna",
            "Small Tripod",
            "Spare Cables",
            "MTI Antennas",
            "Omni Antennas",
            "Black Omni Mount",
            "Car Mount",
            "Hercules Tripod",
            "Caracal Mechanic Mount",
            "Mechanic Tube",
            "Base Weldment",
            "BNET Holder Weldment",
            "Clamp Weldment",
            "Mechanic Screws",
            "Laptop",
            "BNET Brochures / Flyers"
        ];

        let containersData = [];
        let uploadedImages = [];
        let qtyOptionsHTML = '';
        let snOptionsHTML = '';

        window.onload = () => {
            // Generate dropdown options
            qtyOptionsHTML = '<option value="">Qty</option>';
            for(let i=1; i<=30; i++) {
                qtyOptionsHTML += `<option value="${i}">${i}</option>`;
            }

            snOptionsHTML = '<option value="">SN</option>';
            for(let i=0; i<=100; i++) {
                let num = i < 10 ? '0' + i : i;
                snOptionsHTML += `<option value="${num}">${num}</option>`;
            }

            // Populate list
            masterEquipment.forEach((item, index) => {
                appendItemToDOM(item, index);
            });
        };

        // Handle Images
        document.getElementById('carnetImages').addEventListener('change', function(event) {
            const files = event.target.files;
            for(let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImages.push(e.target.result);
                    updateImagePreview();
                }
                reader.readAsDataURL(file);
            }
        });

        function updateImagePreview() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            uploadedImages.forEach((imgSrc, index) => {
                container.innerHTML += `
                    <div class="relative w-16 h-16 rounded-md overflow-hidden border border-gray-600 group">
                        <img src="${imgSrc}" class="object-cover w-full h-full opacity-80 group-hover:opacity-100 transition duration-300">
                        <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-500 text-white w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold opacity-0 group-hover:opacity-100 transition shadow">✕</button>
                    </div>
                `;
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            updateImagePreview();
            document.getElementById('carnetImages').value = '';
        }

        // Add item to DOM with New Sleek Design
        function appendItemToDOM(itemName, index) {
            const listDiv = document.getElementById('equipmentList');
            const id = `item-${index}`;
            const itemHTML = `
                <div class="item-row flex items-center justify-between p-3 rounded-lg border border-white/5 bg-gray-800/30">
                    <div class="flex items-center gap-3 flex-grow">
                        <input type="checkbox" id="${id}_check" value="${itemName}" class="custom-checkbox">
                        <label for="${id}_check" class="text-sm text-gray-200 cursor-pointer font-medium select-none w-full">${itemName}</label>
                    </div>
                    <div class="flex items-center gap-2 ml-4">
                        <select id="${id}_qty" class="w-16 py-1 px-2 h-8 text-xs font-mono-data text-center">
                            ${qtyOptionsHTML}
                        </select>
                        <select id="${id}_sn" class="w-16 py-1 px-2 h-8 text-xs font-mono-data text-center">
                            ${snOptionsHTML}
                        </select>
                    </div>
                </div>
            `;
            listDiv.insertAdjacentHTML('beforeend', itemHTML);
        }

        function addCustomItem() {
            const inputEl = document.getElementById('customItemInput');
            const newItemName = inputEl.value.trim();
            
            if (!newItemName) {
                alert("Please enter an item name.");
                return;
            }

            masterEquipment.push(newItemName);
            const newIndex = masterEquipment.length - 1;
            
            appendItemToDOM(newItemName, newIndex);
            
            const listDiv = document.getElementById('equipmentList');
            listDiv.scrollTop = listDiv.scrollHeight;
            inputEl.value = '';
        }

        function addContainer() {
            const boxType = document.getElementById('boxType').value;
            const boxNumber = document.getElementById('boxNumber').value;
            const boxOwner = document.getElementById('boxOwner').value;
            
            let selectedItems = [];
            
            masterEquipment.forEach((item, index) => {
                const checkEl = document.getElementById(`item-${index}_check`);
                if(checkEl && checkEl.checked) {
                    const qty = document.getElementById(`item-${index}_qty`).value;
                    const sn = document.getElementById(`item-${index}_sn`).value;
                    
                    let finalString = item;
                    
                    if (qty) finalString = `${qty}x ${finalString}`;
                    if (sn) finalString = `${finalString} (SN: ${sn})`;
                    
                    selectedItems.push(finalString);
                }
            });

            if (selectedItems.length === 0) {
                alert("Container is empty. Please select at least one item.");
                return;
            }

            containersData.push({
                title: `${boxType} ${boxNumber}` + (boxOwner ? ` (Owner: ${boxOwner})` : ''),
                items: selectedItems
            });

            // Reset Form for next container
            document.getElementById('boxNumber').value = parseInt(boxNumber) + 1;
            masterEquipment.forEach((_, index) => {
                const checkEl = document.getElementById(`item-${index}_check`);
                if(checkEl) {
                    checkEl.checked = false;
                    document.getElementById(`item-${index}_qty`).value = '';
                    document.getElementById(`item-${index}_sn`).value = '';
                }
            });

            updatePreview();
        }

        function updatePreview() {
            const previewArea = document.getElementById('previewArea');
            const pdfContainers = document.getElementById('pdf-containers');
            
            if (containersData.length > 0 && previewArea.innerHTML.includes('NO CONTAINERS CONFIGURED')) {
                previewArea.innerHTML = ''; 
            }
            
            previewArea.innerHTML = '';
            pdfContainers.innerHTML = '';

            containersData.forEach(container => {
                // UI Preview Update
                const containerHTML = `
                    <div class="bg-gray-800/40 rounded-lg border border-gray-700/50 overflow-hidden">
                        <div class="bg-gray-800/80 px-4 py-2.5 border-b border-gray-700/50 flex items-center gap-2">
                            <div class="w-1.5 h-4 bg-emerald-500 rounded-sm"></div>
                            <h2 class="font-semibold text-gray-200 text-sm tracking-wide">${container.title}</h2>
                        </div>
                        <div class="p-4">
                            <ul class="space-y-2">
                                ${container.items.map(item => `
                                    <li class="flex items-start gap-2 text-sm text-gray-300">
                                        <svg class="w-4 h-4 text-gray-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                        <span>${item}</span>
                                    </li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
                previewArea.innerHTML += containerHTML;
                
                // Hidden PDF DOM Update
                const pdfSection = document.createElement('div');
                pdfSection.innerHTML = `<h2>${container.title}</h2><ul>${container.items.map(item => `<li>${item}</li>`).join('')}</ul>`;
                pdfContainers.appendChild(pdfSection);
            });
        }

        function generatePDF() {
            if(containersData.length === 0) {
                alert("No containers to export.");
                return;
            }

            document.getElementById('pdf-dest').innerText = document.getElementById('destination').value || 'TBD';
            document.getElementById('pdf-dates').innerText = document.getElementById('dates').value || 'TBD';

            // Add Images to PDF
            const pdfCarnetSection = document.getElementById('pdf-carnet-section');
            pdfCarnetSection.innerHTML = '';
            if (uploadedImages.length > 0) {
                pdfCarnetSection.innerHTML = '<h1 style="page-break-before: always; margin-top: 20px;">DOCUMENTS / ATA CARNET</h1>';
                uploadedImages.forEach(imgSrc => {
                    pdfCarnetSection.innerHTML += `
                        <div style="text-align: center; margin-bottom: 40px;">
                            <img src="${imgSrc}" style="max-width: 100%; max-height: 900px; border: 1px solid #E5E7EB; border-radius: 4px;">
                        </div>
                    `;
                });
            }

            const element = document.getElementById('pdf-content');
            element.style.display = 'block';

            const opt = {
                margin:       15,
                filename:     'BNET_Tactical_Manifest.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.style.display = 'none';
            });
        }
    </script>
</body>
</html>
